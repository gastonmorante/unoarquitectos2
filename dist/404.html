<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-bg: #FDFCF9;
      --color-teal: #009E9B;
      --color-arena: #C8B89A;
      --color-text: #4A4A4A;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: 'Raleway', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 620px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(200, 184, 154, 0.35);
      border-radius: 24px;
      padding: 48px 32px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(12px);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
    }
    .error-code {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--color-arena);
      margin-bottom: 12px;
    }
    h1 {
      font-size: 28px;
      font-weight: 600;
      color: var(--color-teal);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 16px;
      line-height: 1.3;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: var(--color-text);
      margin-bottom: 32px;
      font-weight: 400;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .btn-primary {
      background-color: var(--color-teal);
      color: #fff;
      border: 1px solid var(--color-teal);
    }
    .btn-primary:hover {
      background-color: var(--color-arena);
      border-color: var(--color-arena);
    }
    .btn-secondary {
      background-color: transparent;
      color: var(--color-text);
      border: 1px solid rgba(200, 184, 154, 0.6);
    }
    .btn-secondary:hover {
      border-color: var(--color-teal);
      color: var(--color-teal);
    }
    .footer-text {
      margin-top: 36px;
      font-size: 11px;
      color: rgba(74, 74, 74, 0.6);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <mask id="m">
          <rect width="200" height="200" fill="#fff"/>
          <line x1="100" y1="12" x2="100" y2="67" stroke="#000" stroke-width="3.2" stroke-linecap="square"/>
          <line x1="25" y1="143.5" x2="71.5" y2="116.5" stroke="#000" stroke-width="3.2" stroke-linecap="square"/>
          <line x1="175" y1="143.5" x2="128.5" y2="116.5" stroke="#000" stroke-width="3.2" stroke-linecap="square"/>
        </mask>
      </defs>
      <path d="M 100 16.86 L 172 58.43 L 172 141.57 L 100 183.14 L 28 141.57 L 28 58.43 Z" fill="#009E9B" mask="url(#m)"/>
      <path d="M 100 65.36 L 130 82.68 L 130 117.32 L 100 134.64 L 70 117.32 L 70 82.68 Z" fill="#fff" stroke="none"/>
      <path d="M 100 100 L 100 134.64 M 100 100 L 70 82.68 M 100 100 L 130 82.68" stroke="#009E9B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="error-code">Error 404 • Not Found</div>
    <h1>Espacio No Encontrado</h1>
    <p>
      La página o coordenada solicitada no existe o ha sido reubicada dentro de nuestra colección arquitectónica.
    </p>
    <div class="buttons">
      <a href="https://unoarquitectos.com/" class="btn btn-primary">Volver al Inicio</a>
      <a href="https://unoarquitectos.com/#proyectos" class="btn btn-secondary">Ver Portafolio</a>
      <a href="https://unoarquitectos.com/#contacto" class="btn btn-secondary">Contacto</a>
    </div>
    <div class="footer-text">
      © UNO Arquitectos • Riviera Maya
    </div>
  </div>
</body>
</html>
